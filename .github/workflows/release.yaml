name: Release
on:
  release:
    types: [created]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - uses: actions/setup-go@v6
        with: { go-version: '1.27' }

      # The goreleaser before hook builds the console, which is embedded in the binary.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

#      # The image is built for linux/arm64 too, and the release Dockerfile runs apk inside it.
#      - uses: docker/setup-qemu-action@v4
#      - uses: docker/setup-buildx-action@v4
#
#      - uses: docker/login-action@v4
#        with:
#          registry: ghcr.io
#          username: ${{ github.actor }}
#          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          # A PAT: the brew formula is pushed to another repository.
          GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
